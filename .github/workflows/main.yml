name: Geometry Unit Tests CI/CD

on:
  push:
    branches: [ main, master, lab4-unit-tests, lab5-ci-cd ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Run unit tests
      run: |
        echo "=== Запуск всех unit-тестов ==="
        
        for test_file in circle.py square.py rectangle.py triangle.py; do
          echo "Тестирование: $test_file"
          echo "------------------------------------------"
          python3 -m unittest "$test_file" -v || exit 1
          echo "$test_file: УСПЕХ"
          echo ""
        done
        
        echo "🎉 ВСЕ ТЕСТЫ УСПЕШНО ПРОЙДЕНЫ!"